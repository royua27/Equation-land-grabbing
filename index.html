<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>시뮬레이터</title>
  
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700;800&display=swap');

    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #050505;
      font-family: 'Inter', sans-serif;
      color: #e5e5e5;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    button, .cursor-pointer {
      touch-action: manipulation;
    }

    .board-grid-bg {
      background-color: #b89645;
      padding: 1px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const Icons = {
      Refresh: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
      Delete: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg>,
      Play: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
      Info: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
      Clock: ({ size, className }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    };

    const BOARD_SIZE = 13;
    const NUMBERS_ALLOWED = [1, 2, 3, 4, 5, 6];
    const WINNING_SCORE = 50;
    const TURN_TIME_LIMIT = 180; // 3분 = 180초

    // 이미지 원본과 일치하는 좌표 기반 장애물 판별 함수
    const isObstacleCell = (r, c) => {
      const obstacles = [
        [3, 3], [3, 9],
        [4, 8],
        [5, 7],
        [6, 6],
        [7, 5],
        [8, 4],
        [9, 3], [9, 9]
      ];
      return obstacles.some(([or, oc]) => or === r && oc === c);
    };

    const evaluateFormula = (tokens) => {
      if (tokens.length === 0) return null;
      
      for (let i = 0; i < tokens.length - 1; i++) {
        if (/^[1-9]$/.test(tokens[i]) && /^[1-9]$/.test(tokens[i + 1])) return null;
      }

      const precedence = { '+': 1, '-': 1, '×': 2, '÷': 2, '^': 3, '√': 4 };
      const isOperator = (t) => ['+', '-', '×', '÷', '^', '√'].includes(t);
      
      let outputQueue = [];
      let operatorStack = [];

      for (let i = 0; i < tokens.length; i++) {
        let t = tokens[i];
        if (/^[1-9]$/.test(t)) {
          outputQueue.push(parseInt(t, 10));
        } else if (t === '!') {
          outputQueue.push(t);
        } else if (isOperator(t)) {
          while (
            operatorStack.length > 0 &&
            operatorStack[operatorStack.length - 1] !== '(' &&
            (
              (precedence[operatorStack[operatorStack.length - 1]] > precedence[t]) ||
              (precedence[operatorStack[operatorStack.length - 1]] === precedence[t] && t !== '^' && t !== '√')
            )
          ) {
            outputQueue.push(operatorStack.pop());
          }
          operatorStack.push(t);
        } else if (t === '(') {
          operatorStack.push(t);
        } else if (t === ')') {
          while (operatorStack.length > 0 && operatorStack[operatorStack.length - 1] !== '(') {
            outputQueue.push(operatorStack.pop());
          }
          if (operatorStack.length === 0) return null;
          operatorStack.pop();
        }
      }

      while (operatorStack.length > 0) {
        if (operatorStack[operatorStack.length - 1] === '(') return null;
        outputQueue.push(operatorStack.pop());
      }

      const Icons = {
        Refresh: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
        Delete: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg>,
        Play: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
        Pause: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
        Info: ({ size }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
        Clock: ({ size, className }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      };

      for (let t of outputQueue) {
        if (typeof t === 'number') {
          evalStack.push(t);
        } else if (t === '!') {
          if (evalStack.length < 1) return null;
          evalStack.push(factorial(evalStack.pop()));
        } else if (t === '√') {
          if (evalStack.length < 1) return null;
          let a = evalStack.pop();
          if (a < 0) return null;
          evalStack.push(Math.sqrt(a));
        } else if (isOperator(t)) {
          if (evalStack.length < 2) return null;
          let b = evalStack.pop();
          let a = evalStack.pop();
          if (t === '+') evalStack.push(a + b);
          if (t === '-') evalStack.push(a - b);
          if (t === '×') evalStack.push(a * b);
          if (t === '÷') {
            if (b === 0) return null;
            evalStack.push(a / b);
          }
          if (t === '^') evalStack.push(Math.pow(a, b));
        }
      }
      
      if (evalStack.length !== 1) return null;
      const res = evalStack[0];
      if (Math.abs(res - Math.round(res)) < 0.00001) return Math.round(res);
      return res;
    };

    function App() {
      const [board, setBoard] = useState([]);
      const [turn, setTurn] = useState(1);
      const [scores, setScores] = useState({ 1: 1, 2: 1 });
      const [selection, setSelection] = useState({ start: null, end: null, cells: [], targetNumber: null });
      const [formula, setFormula] = useState([]);
      const [message, setMessage] = useState("게임 시작 대기 중...");
      const [winner, setWinner] = useState(null);
      const [timeLeft, setTimeLeft] = useState(TURN_TIME_LIMIT);
      const [gameState, setGameState] = useState('WAITING');

      // 게임 초기화
      const initializeGame = useCallback(() => {
        const SOLVABLE_TARGETS = [
          "720", "1296", "3125", "7776", "46656", "15625", "4096", "1024",
          "1440", "2160", "2880", "3600", "4320", "8640", "17280", "86400", 
          "64126", "256", "512", "2048", "8192", "531441", "6561",
          "59049", "279936", "1679616", "362880", "390625", "117649"
        ];

        const newBoard = Array.from({ length: BOARD_SIZE }, (_, r) =>
          Array.from({ length: BOARD_SIZE }, (_, c) => {
            const isObs = isObstacleCell(r, c);
            return {
              type: isObs ? 'obstacle' : 'number',
              digit: isObs ? 'X' : null,
              owner: 0,
            };
          })
        );

        const targets = [...SOLVABLE_TARGETS].sort(() => Math.random() - 0.5);
        targets.forEach(target => {
          const isHorizontal = Math.random() > 0.5;
          const len = target.length;
          let placed = false;
          let attempts = 0;

          while (!placed && attempts < 50) {
            attempts++;
            const r = Math.floor(Math.random() * BOARD_SIZE);
            const c = Math.floor(Math.random() * BOARD_SIZE);

            if (isHorizontal && c + len <= BOARD_SIZE) {
              let canPlace = true;
              for (let i = 0; i < len; i++) {
                if (newBoard[r][c + i].type === 'obstacle' || (newBoard[r][c + i].digit !== null && newBoard[r][c + i].digit !== target[i])) {
                  canPlace = false; break;
                }
              }
              if (canPlace) {
                for (let i = 0; i < len; i++) { newBoard[r][c + i].digit = target[i]; }
                placed = true;
              }
            } else if (!isHorizontal && r + len <= BOARD_SIZE) {
              let canPlace = true;
              for (let i = 0; i < len; i++) {
                if (newBoard[r + i][c].type === 'obstacle' || (newBoard[r + i][c].digit !== null && newBoard[r + i][c].digit !== target[i])) {
                  canPlace = false; break;
                }
              }
              if (canPlace) {
                for (let i = 0; i < len; i++) { newBoard[r + i][c].digit = target[i]; }
                placed = true;
              }
            }
          }
        });

        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (newBoard[r][c].type === 'number' && newBoard[r][c].digit === null) {
              // 0을 제외한 1~9 무작위 배치
              newBoard[r][c].digit = Math.floor(Math.random() * 9) + 1;
            } else if (newBoard[r][c].type === 'number') {
              newBoard[r][c].digit = parseInt(newBoard[r][c].digit, 10);
            }
          }
        }

        newBoard[0][0].owner = 1;
        newBoard[BOARD_SIZE - 1][BOARD_SIZE - 1].owner = 2;
        setBoard(newBoard);
        setScores({ 1: 1, 2: 1 });
        setTurn(1);
        setSelection({ start: null, end: null, cells: [], targetNumber: null });
        setFormula([]);
        setTimeLeft(TURN_TIME_LIMIT);
        setMessage("게임 시작 대기 중...");
        setWinner(null);
        setGameState('WAITING');
      }, []);

      useEffect(() => { initializeGame(); }, [initializeGame]);

      // 타이머 다운카운트
      useEffect(() => {
        if (gameState !== 'PLAYING') return;
        const timerId = setInterval(() => {
          setTimeLeft(prev => prev - 1);
        }, 1000);
        return () => clearInterval(timerId);
      }, [gameState, turn]);

      // 타이머 종료 시 턴 전환 로직
      useEffect(() => {
        if (timeLeft <= 0 && gameState === 'PLAYING') {
          const nextTurn = turn === 1 ? 2 : 1;
          setMessage(`⏳ 시간 초과! Player ${nextTurn}의 턴으로 넘어갑니다.`);
          setTurn(nextTurn);
          setSelection({ start: null, end: null, cells: [], targetNumber: null });
          setFormula([]);
          setTimeLeft(TURN_TIME_LIMIT);
        }
      }, [timeLeft, turn, gameState]);

      const handleCellClick = (r, c) => {
        if (gameState !== 'PLAYING') return;
        if (board[r][c].type === 'obstacle') {
          setMessage("장애물(X)은 선택할 수 없습니다.");
          return;
        }

        // 새 영역 선택 시작
        if (!selection.start || (selection.start && selection.end)) {
          setSelection({ start: { r, c }, end: null, cells: [{ r, c }], targetNumber: null });
          setMessage("끝점을 터치하여 타깃 넘버를 완성하세요.");
        } 
        // 끝점 선택 완료
        else {
          const start = selection.start;
          const end = { r, c };

          if (start.r !== end.r && start.c !== end.c) {
            setMessage("오류: 타깃 넘버는 가로 또는 세로 직선이어야 합니다.");
            setSelection({ start: null, end: null, cells: [], targetNumber: null });
            return;
          }

          const minR = Math.min(start.r, end.r);
          const maxR = Math.max(start.r, end.r);
          const minC = Math.min(start.c, end.c);
          const maxC = Math.max(start.c, end.c);
          const length = Math.max(maxR - minR, maxC - minC) + 1;

          if (length < 3) {
            setMessage("오류: 타깃 넘버는 최소 3자리 이상이어야 합니다.");
            setSelection({ start: null, end: null, cells: [], targetNumber: null });
            return;
          }

          // **핵심 룰:** 시작점 또는 끝점 중 최소 하나는 무조건 현재 턴 유저의 소유지여야 함.
          const startOwner = board[start.r][start.c].owner;
          const endOwner = board[end.r][end.c].owner;
          
          if (startOwner !== turn && endOwner !== turn) {
            setMessage("오류: 본인의 땅과 시작 또는 끝으로 이어지지 않았습니다. 다시 선택해주세요.");
            setSelection({ start: null, end: null, cells: [], targetNumber: null });
            return;
          }

          let valid = true;
          let targetStr = "";
          let pathCells = [];
          
          const collectCellInfo = (i, isRowIter) => {
             const cellR = isRowIter ? minR : i;
             const cellC = isRowIter ? i : minC;
             const cell = board[cellR][cellC];
             
             if (cell.type === 'obstacle') valid = false;
             if (cell.owner === (turn === 1 ? 2 : 1)) valid = false; // 상대방 땅 불가
             
             pathCells.push({ r: cellR, c: cellC });
             targetStr += cell.digit;
          };

          if (minR === maxR) {
            for (let i = minC; i <= maxC; i++) collectCellInfo(i, true);
          } else {
            for (let i = minR; i <= maxR; i++) collectCellInfo(i, false);
          }

          if (!valid) {
            setMessage("오류: 장애물(X)이나 상대방의 땅을 통과할 수 없습니다.");
            setSelection({ start: null, end: null, cells: [], targetNumber: null });
            return;
          }

          // 타깃 생성 시 순서 보정 로직 (시작점 -> 끝점 방향대로 타깃넘버 문자열 생성)
          let finalTargetStr = "";
          if (start.r === end.r) {
             const step = start.c <= end.c ? 1 : -1;
             for(let i = start.c; i !== end.c + step; i += step) finalTargetStr += board[start.r][i].digit;
          } else {
             const step = start.r <= end.r ? 1 : -1;
             for(let i = start.r; i !== end.r + step; i += step) finalTargetStr += board[i][start.c].digit;
          }

          setSelection({ start, end, cells: pathCells, targetNumber: parseInt(finalTargetStr, 10) });
          setMessage(`타깃 넘버 [ ${parseInt(finalTargetStr, 10).toLocaleString()} ] 완성! 수식을 입력하세요.`);
          setFormula([]);
        }
      };

      const handleFormulaInput = (token) => {
        if (winner || !selection.targetNumber) return;
        setFormula((prev) => [...prev, token]);
      };

      const submitFormula = () => {
        if (!selection.targetNumber) return;
        const result = evaluateFormula(formula);
        if (result === null || Number.isNaN(result)) {
          setMessage("오류: 유효하지 않거나 계산 불가능한 수식입니다.");
          return;
        }

        if (result === selection.targetNumber) {
          const newBoard = [...board];
          let gained = 0;
          selection.cells.forEach(({ r, c }) => {
            if (newBoard[r][c].owner !== turn) {
              newBoard[r][c] = { ...newBoard[r][c], owner: turn };
              gained++;
            }
          });
          
          const newScores = { ...scores, [turn]: scores[turn] + gained };
          setBoard(newBoard);
          setScores(newScores);

          if (newScores[turn] >= WINNING_SCORE) {
            setWinner(turn);
            setGameState('ENDED');
            setMessage(`🎉 게임 종료! Player ${turn} 승리! (${WINNING_SCORE}점 달성)`);
          } else {
            const nextTurn = turn === 1 ? 2 : 1;
            setTurn(nextTurn);
            setMessage(`✅ 정답! Player ${nextTurn}의 턴입니다.`);
            setSelection({ start: null, end: null, cells: [], targetNumber: null });
            setFormula([]);
            setTimeLeft(TURN_TIME_LIMIT); // 성공 시 타이머 리셋
          }
        } else {
          setMessage(`❌ 오답입니다. 제출한 수식의 결과: ${result.toLocaleString()}`);
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (gameState !== 'PLAYING' || !selection.targetNumber) return;
          const key = e.key;
          if (['1', '2', '3', '4', '5', '6'].includes(key)) {
            if (formula.filter((t) => t === key).length < 2) handleFormulaInput(key);
          } else if (key === '+') handleFormulaInput('+');
          else if (key === '-') handleFormulaInput('-');
          else if (key === '*') handleFormulaInput('×');
          else if (key === '/') { e.preventDefault(); handleFormulaInput('÷'); }
          else if (key === '^') handleFormulaInput('^');
          else if (key === '!') handleFormulaInput('!');
          else if (key === '(') handleFormulaInput('(');
          else if (key === ')') handleFormulaInput(')');
          else if (key.toLowerCase() === 'r') handleFormulaInput('√');
          else if (key === 'Backspace') setFormula((prev) => prev.slice(0, -1));
          else if (key === 'Enter') submitFormula();
          else if (key === 'Escape') {
             setSelection({ start: null, end: null, cells: [], targetNumber: null });
             setFormula([]);
             setMessage("선택이 취소되었습니다. 다시 영역을 선택하세요.");
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [winner, selection.targetNumber, formula]);

      const isCellSelected = (r, c) => selection.cells.some(cell => cell.r === r && cell.c === c);
      const isStartCell = (r, c) => selection.start && !selection.end && selection.start.r === r && selection.start.c === c;
      const currentPreview = evaluateFormula(formula);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="min-h-screen p-2 sm:p-6 flex flex-col items-center select-none pb-20">
          
          {/* 헤더 영역 */}
          <header className="w-full max-w-5xl flex justify-end items-center mb-6 bg-neutral-900 border border-[#b89645]/30 p-4 rounded-xl shadow-lg">
            <div className="flex items-center gap-2">
              {gameState === 'PLAYING' && (
                <button onClick={() => setGameState('PAUSED')} className="flex items-center gap-2 px-4 py-2 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 rounded-lg text-sm font-semibold transition border border-neutral-600 hover:border-blue-500">
                  <Icons.Pause size={16} /> 일시정지
                </button>
              )}
              <button onClick={initializeGame} className="flex items-center gap-2 px-4 py-2 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 rounded-lg text-sm font-semibold transition border border-neutral-600 hover:border-[#b89645]">
                <Icons.Refresh size={16} /> 리셋
              </button>
            </div>
          </header>

          <div className="w-full max-w-5xl flex flex-col lg:flex-row gap-6 lg:gap-10">
            
            {}
            {/* 좌측: 보드 영역 */}
            <div className="flex-1 flex flex-col items-center">
              
              {/* 스코어보드 및 타이머 */}
              <div className="w-full max-w-[500px] flex justify-between items-center mb-6 bg-neutral-900/50 p-3 rounded-2xl border border-neutral-800">
                <div className={`flex flex-col items-center px-6 py-2 rounded-xl transition-all duration-300 ${turn === 1 ? 'border-2 border-blue-500 bg-blue-950/60 shadow-[0_0_15px_rgba(59,130,246,0.3)]' : 'border-2 border-transparent'}`}>
                  <span className="text-blue-400 font-extrabold text-xs tracking-widest mb-1">P1 (BLUE)</span>
                  <span className="text-2xl font-mono font-bold text-white">{scores[1]}</span>
                </div>
                
                {/* 턴 타이머 표시 */}
                <div className="flex flex-col items-center px-4">
                  <div className="flex items-center gap-1.5 text-neutral-400 mb-1">
                    <Icons.Clock size={14} className={timeLeft <= 30 && !winner ? "text-red-400" : ""} />
                    <span className="text-xs font-bold tracking-widest uppercase">Time</span>
                  </div>
                  <div className={`text-3xl font-mono font-black tracking-tighter ${timeLeft <= 30 && !winner ? 'text-red-500 animate-pulse drop-shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'text-[#b89645]'}`}>
                    {formatTime(timeLeft)}
                  </div>
                </div>

                <div className={`flex flex-col items-center px-6 py-2 rounded-xl transition-all duration-300 ${turn === 2 ? 'border-2 border-red-500 bg-red-950/60 shadow-[0_0_15px_rgba(239,68,68,0.3)]' : 'border-2 border-transparent'}`}>
                  <span className="text-red-400 font-extrabold text-xs tracking-widest mb-1">P2 (RED)</span>
                  <span className="text-2xl font-mono font-bold text-white">{scores[2]}</span>
                </div>
              </div>

              {/* 게임 보드 */}
              <div className="w-full max-w-[500px] rounded border-2 border-[#b89645] p-1 bg-black shadow-[0_0_30px_rgba(184,150,69,0.15)] relative overflow-hidden">
                
                {/* 상태 오버레이 (대기, 일시정지, 종료) */}
                {gameState !== 'PLAYING' && (
                  <div className="absolute inset-0 z-20 bg-[#050505]/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
                    {gameState === 'WAITING' && (
                      <div className="flex flex-col items-center gap-4">
                        <h2 className="text-3xl font-black text-white tracking-widest drop-shadow-md">READY</h2>
                        <p className="text-neutral-400 text-sm mb-4">시작 버튼을 누르면 턴 타이머가 작동합니다.</p>
                        <button onClick={() => { setGameState('PLAYING'); setMessage("게임 시작. 본인의 땅을 시작/끝으로 삼아 타깃 넘버를 구성하세요."); }} className="px-8 py-3 bg-gradient-to-b from-[#d4af37] to-[#b89645] hover:opacity-90 active:scale-95 text-black font-extrabold text-xl rounded-xl shadow-lg transition-all">
                          게임 시작
                        </button>
                      </div>
                    )}
                    {gameState === 'PAUSED' && (
                      <div className="flex flex-col items-center gap-4">
                        <h2 className="text-3xl font-black text-white tracking-widest drop-shadow-md">PAUSED</h2>
                        <p className="text-neutral-400 text-sm mb-4">게임판이 가려졌습니다.</p>
                        <button onClick={() => setGameState('PLAYING')} className="px-8 py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 active:scale-95 text-white font-extrabold text-xl rounded-xl shadow-lg transition-all">
                          계속 하기
                        </button>
                      </div>
                    )}
                    {gameState === 'ENDED' && (
                      <div className="flex flex-col items-center gap-4">
                        <h2 className="text-3xl font-black text-white mb-2">게임 종료!</h2>
                        <p className="text-2xl font-bold text-[#b89645] mb-4">Player {winner} 승리!</p>
                        <button onClick={initializeGame} className="px-8 py-3 bg-neutral-800 border border-neutral-600 hover:bg-neutral-700 active:scale-95 text-white font-bold text-lg rounded-xl shadow-lg transition-all">
                          새 게임 시작
                        </button>
                      </div>
                    )}
                  </div>
                )}

                <div className="grid board-grid-bg gap-[1px]" style={{ gridTemplateColumns: `repeat(${BOARD_SIZE}, minmax(0, 1fr))` }}>
                  {board.map((row, r) =>
                    row.map((cell, c) => {
                      const selected = isCellSelected(r, c);
                      const startPulsing = isStartCell(r, c);
                      
                      let bgClass = "bg-[#0a0a0a] hover:bg-[#1f1f1f]";
                      let textClass = "text-neutral-300";
                      
                      if (cell.type === 'obstacle') {
                        bgClass = "bg-[#14120b]";
                        textClass = "text-[#b89645] opacity-60";
                      } else if (cell.owner === 1) {
                        bgClass = "bg-blue-700 shadow-inner";
                        textClass = "text-white";
                      } else if (cell.owner === 2) {
                        bgClass = "bg-red-700 shadow-inner";
                        textClass = "text-white";
                      }

                      // 선택 영역 붉은색 테두리 효과 강조
                      let selectionStyles = "";
                      if (selected) {
                        bgClass = "bg-red-900 shadow-inner";
                        textClass = "text-white font-black drop-shadow-md";
                        selectionStyles = "ring-[3px] ring-red-500 ring-inset z-10 scale-[1.05]";
                      } else if (startPulsing) {
                        selectionStyles = "ring-2 ring-yellow-400 ring-inset z-10 animate-pulse bg-yellow-900/30";
                      }

                      return (
                        <div
                          key={`${r}-${c}`}
                          onPointerDown={() => handleCellClick(r, c)}
                          className={`
                            aspect-square flex items-center justify-center font-mono font-bold text-base sm:text-lg lg:text-xl
                            cursor-pointer transition-all duration-150 relative
                            ${bgClass} ${textClass} ${selectionStyles}
                          `}
                        >
                          {cell.digit}
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>

            {}
            {/* 우측: 상태 메세지 및 수식 컨트롤러 */}
            <div className="w-full lg:w-[420px] flex flex-col gap-4">
              
              <div className="bg-neutral-900/80 p-4 rounded-xl border border-neutral-700 flex flex-col min-h-[140px] justify-between">
                <div className="flex items-start gap-3 text-neutral-300 mb-3">
                  <Icons.Info size={20} className="shrink-0 mt-0.5 text-[#b89645]" />
                  <p className="text-sm font-medium leading-relaxed break-keep">{message}</p>
                </div>
                
                {selection.targetNumber ? (
                  <div className="flex items-center justify-between bg-black border-2 border-red-900/50 p-4 rounded-lg shadow-inner">
                    <span className="text-xs font-bold text-neutral-500 tracking-widest uppercase">Target Number</span>
                    <span className="text-3xl font-mono font-extrabold text-red-500 tracking-tight drop-shadow-[0_0_8px_rgba(239,68,68,0.4)]">
                      {selection.targetNumber.toLocaleString()}
                    </span>
                  </div>
                ) : (
                  <div className="flex items-center justify-center h-[76px] bg-black/50 border border-neutral-800 rounded-lg border-dashed">
                    <span className="text-neutral-600 font-mono text-sm">Target Number Wait...</span>
                  </div>
                )}
              </div>

              <div className="bg-neutral-900/80 p-5 rounded-xl border border-neutral-700 flex-1 flex flex-col">
                
                {/* 실시간 수식 디스플레이 */}
                <div className="relative w-full h-[72px] bg-black border border-neutral-600 rounded-lg mb-4 flex items-center px-4 overflow-x-auto overflow-y-hidden shadow-inner">
                  {formula.length === 0 ? (
                     <span className="text-neutral-600 font-mono text-lg italic select-none">수식을 조합하세요...</span>
                  ) : (
                     <div className="flex items-center gap-1.5 font-mono text-2xl font-bold whitespace-nowrap">
                       {formula.map((t, i) => (
                         <span key={i} className={['+', '-', '×', '÷', '^', '√', '!'].includes(t) ? "text-[#b89645]" : "text-white"}>{t}</span>
                       ))}
                     </div>
                  )}
                </div>

                <div className="flex justify-end items-center mb-6 px-2 gap-3">
                  <span className="text-lg font-bold text-neutral-500">=</span>
                  <span className={`text-3xl font-mono font-extrabold transition-colors duration-200 ${currentPreview === selection.targetNumber && selection.targetNumber !== null ? 'text-green-400 drop-shadow-[0_0_8px_rgba(74,222,128,0.5)]' : 'text-neutral-300'}`}>
                    {currentPreview !== null ? currentPreview.toLocaleString() : '?'}
                  </span>
                </div>

                {/* 숫자 패드 */}
                <div className="grid grid-cols-3 gap-2 mb-4">
                  {NUMBERS_ALLOWED.map((num) => {
                    const used = formula.filter((t) => t === String(num)).length;
                    const disabled = used >= 2 || !selection.targetNumber;
                    return (
                      <button
                        key={`num-${num}`}
                        onClick={() => handleFormulaInput(String(num))}
                        disabled={disabled}
                        className={`
                          relative py-3 sm:py-4 rounded-xl font-mono font-extrabold text-xl transition-all
                          ${disabled 
                            ? 'bg-neutral-800 text-neutral-600 border border-neutral-700 opacity-50 cursor-not-allowed' 
                            : 'bg-gradient-to-b from-[#2a2a2a] to-[#1a1a1a] text-white border border-neutral-600 hover:border-neutral-400 active:scale-95 shadow-md'}
                        `}
                      >
                        {num}
                        <div className="absolute top-1 right-2 flex gap-1">
                           {[...Array(2)].map((_, i) => (
                             <div key={i} className={`w-1.5 h-1.5 rounded-full ${i < used ? 'bg-[#b89645]' : 'bg-neutral-700'}`} />
                           ))}
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* 연산자 패드 */}
                <div className="grid grid-cols-4 gap-2 mb-4">
                  {['+', '-', '×', '÷', '^', '√', '(', ')', '!'].map((op) => (
                    <button
                      key={op}
                      onClick={() => handleFormulaInput(op)}
                      disabled={!selection.targetNumber}
                      className="py-2.5 sm:py-3 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 border border-neutral-700 text-[#b89645] font-mono text-xl font-bold rounded-lg transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"
                    >
                      {op}
                    </button>
                  ))}
                  <button
                    onClick={() => setFormula((prev) => prev.slice(0, -1))}
                    disabled={formula.length === 0}
                    className="py-2.5 sm:py-3 col-span-3 bg-[#3a1c1c] hover:bg-[#4a2424] active:bg-[#2e1414] border border-red-900/50 text-red-400 flex items-center justify-center rounded-lg transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"
                  >
                    <Icons.Delete size={22} />
                  </button>
                </div>

                <button
                  onClick={submitFormula}
                  disabled={!selection.targetNumber || formula.length === 0}
                  className="w-full mt-auto py-4 bg-gradient-to-r from-[#d4af37] to-[#b89645] hover:opacity-90 active:scale-[0.98] text-black font-extrabold text-lg rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg disabled:opacity-30 disabled:grayscale disabled:cursor-not-allowed"
                >
                  <Icons.Play size={20} /> 정답 제출
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
